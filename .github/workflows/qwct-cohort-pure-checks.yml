name: QWCT Cohort Pure Checks

on:
  push:
    branches: [main]
    paths:
      - 'research/cohort_cloud/**'
      - 'research/universe_cloud/main.py'
      - 'strategy/patterns_bsu.py'
      - 'strategy/native_m5_validation.py'
      - 'tests/test_m5_cohort_research.py'
      - 'tests/test_m5_six_case_research.py'
  pull_request:
    paths:
      - 'research/cohort_cloud/**'
      - 'research/universe_cloud/main.py'
      - 'strategy/patterns_bsu.py'
      - 'strategy/native_m5_validation.py'
      - 'tests/test_m5_cohort_research.py'
      - 'tests/test_m5_six_case_research.py'
  workflow_dispatch:

jobs:
  pure-cohort-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pandas numpy
      - name: Verify causal Fundamental gate and original M5 detector
        run: python -m pytest -q tests/test_m5_cohort_research.py tests/test_m5_six_case_research.py tests/test_patterns_bsu.py
