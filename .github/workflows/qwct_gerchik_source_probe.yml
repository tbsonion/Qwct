name: QWCT limited public Gerchik source probe
on:
  pull_request:
    paths:
      - 'tools/qwct_probe_gerchik_ids.py'
      - '.github/workflows/qwct_gerchik_source_probe.yml'

permissions:
  contents: read

jobs:
  public-file-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check at most three public file IDs (no downloads)
        run: python tools/qwct_probe_gerchik_ids.py
